<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robot display</title>
<style>
:root { --bg:#17181a; --panel:rgba(35,35,35,.65); --line:#2e3033; --fg:#f4f2ef; --mute:#8a9099; --copper:#c78e66;
        --ease:cubic-bezier(.2,.7,.2,1); --en:"Gill Sans","Gill Sans MT","Segoe UI",sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font-family:"Segoe UI",system-ui,sans-serif; user-select:none; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.cap { font-family:var(--en); letter-spacing:.2em; text-transform:uppercase; color:var(--mute); font-size:1.9vh; }

/* eyes: big when idle, shrink into the top band when content shows */
#eyes { position:fixed; left:50%; top:47%; width:62vw; height:40vh; transform:translate(-50%,-50%); display:flex; justify-content:center; gap:15vw;
        align-items:center; transition:top .6s var(--ease), transform .6s var(--ease); z-index:5; pointer-events:none; }
#eyes i { width:17vw; height:23vh; border-radius:50%; background:radial-gradient(ellipse at 37% 28%,#fff 0 8%,#392b18 9% 54%,#ffcd79 58% 66%,transparent 70%);
          filter:drop-shadow(0 1vh 2.4vh #ffcf7230); transition:transform .12s; }
body.blink #eyes i { transform:scaleY(.08); }
body.up #eyes { top:8.5vh; transform:translate(-50%,-50%) scale(.2); }
body.speaking #eyes i { animation:talk .34s ease-in-out infinite alternate; }
@keyframes talk { to { filter:drop-shadow(0 1vh 3.4vh #ffcf7288) brightness(1.15); } }

#caption { position:fixed; left:6vw; right:6vw; bottom:6vh; text-align:center; font-size:3.6vh; line-height:1.35; color:#e9e4dd; opacity:0;
           transition:opacity .35s; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
#caption.on { opacity:1; }
body.up #caption { display:none; }

.view { position:fixed; inset:17vh 5vw 8vh; opacity:0; pointer-events:none; transform:translateY(3vh); transition:opacity .5s var(--ease), transform .5s var(--ease); }
.view.on { opacity:1; pointer-events:auto; transform:none; }

/* all cars */
#grid h2 { text-align:center; font-weight:400; font-size:4.6vh; }
#grid .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:2.4vh 2vw; margin-top:3.4vh; }
.mt { position:relative; background:var(--panel); border:1px solid var(--line); height:27vh; display:flex; flex-direction:column; align-items:center;
      justify-content:flex-end; padding-bottom:2vh; overflow:hidden; }
.mt img { position:absolute; top:1.5vh; left:6%; width:88%; height:17vh; object-fit:contain; }
.mt b { font-family:var(--en); font-weight:400; letter-spacing:.2em; text-transform:uppercase; font-size:2.3vh; }
.mt small { color:var(--mute); font-size:1.8vh; margin-top:.4vh; }
.mt::after { content:""; position:absolute; right:0; bottom:-1px; height:3px; width:3vh; background:var(--copper); transition:width .45s var(--ease); }
.mt:hover::after { width:100%; }

/* one car */
#car { display:grid; grid-template-columns:1fr 36vw; gap:4vw; }
#car .hero { display:flex; flex-direction:column; justify-content:center; min-width:0; }
#car .name { font-family:var(--en); letter-spacing:.25em; text-transform:uppercase; font-size:3.4vh; }
#car .tag { font-size:4vh; margin-top:1.4vh; line-height:1.25; }
#car img { width:100%; height:38vh; object-fit:contain; margin-top:1vh; }
#car .side { display:flex; flex-direction:column; justify-content:center; gap:1.8vh; }
.kpi { display:flex; align-items:baseline; gap:1.6vh; background:var(--panel); border:1px solid var(--line); padding:2.2vh 2.6vh; position:relative; }
.kpi b { font-size:6.4vh; font-weight:600; letter-spacing:-.02em; }
.kpi span { color:var(--mute); font-size:2.3vh; }
.kpi::after { content:""; position:absolute; right:0; bottom:-1px; height:3px; width:3vh; background:var(--copper); }
#car .price { font-size:2.4vh; color:var(--copper); letter-spacing:.06em; margin-top:.6vh; }

/* key facts */
#facts .head { display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:1.6vh; }
#facts .head b { font-family:var(--en); font-weight:400; letter-spacing:.25em; text-transform:uppercase; font-size:3.2vh; }
#facts .rows { display:grid; grid-template-columns:1fr 1fr; gap:0 4vw; margin-top:1vh; }
#facts .r { display:flex; justify-content:space-between; gap:2vw; padding:1.9vh 0; border-bottom:1px solid var(--line); font-size:2.7vh; }
#facts .r span { color:var(--mute); }
#facts .r b { font-weight:500; text-align:right; }

/* walking */
#walk { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
#walk .big { font-size:7vh; font-weight:300; }
#walk .to { margin-top:2vh; font-family:var(--en); letter-spacing:.25em; text-transform:uppercase; color:var(--copper); font-size:2.8vh; }
#walk .bar { width:46vw; height:.6vh; background:var(--line); margin-top:5vh; overflow:hidden; }
#walk .bar i { display:block; height:100%; width:0; background:var(--copper); transition:width .3s linear; }
#walk .arrow { margin-top:4vh; width:9vh; height:9vh; stroke:var(--fg); fill:none; stroke-width:1.2; animation:nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 50% { transform:translateX(1.6vh); } }

/* greeting */
#hello { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
#hello .big { font-size:7.4vh; font-weight:300; }
#hello .cap { margin-top:2.4vh; }

#foot { position:fixed; left:0; right:0; bottom:2.2vh; text-align:center; font-size:1.6vh; color:#5d6168; letter-spacing:.18em; font-family:var(--en);
        text-transform:uppercase; opacity:0; transition:opacity .4s; }
body.up #foot { opacity:1; }
</style>
</head>
<body>
<div id="eyes"><i></i><i></i></div>
<div id="caption"></div>

<section class="view" id="grid">
  <h2>Which one would you like to see?</h2>
  <div class="tiles" id="tiles"></div>
</section>

<section class="view" id="car">
  <div class="hero">
    <div class="name" id="cName"></div>
    <div class="tag" id="cTag"></div>
    <img id="cImg" alt="">
  </div>
  <div class="side" id="cSide"></div>
</section>

<section class="view" id="facts">
  <div class="head"><b id="fName"></b><span class="cap" id="fType"></span></div>
  <div class="rows" id="fRows"></div>
</section>

<section class="view" id="walk">
  <div class="big">This way, please</div>
  <div class="to" id="wTo"></div>
  <div class="bar"><i id="wBar"></i></div>
  <svg class="arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
</section>

<section class="view" id="hello">
  <div class="big">Welcome in</div>
  <div class="cap">Take your time, I'll show you around</div>
</section>

<div id="foot">Demo lineup · fictional models</div>

<script>
const $ = id => document.getElementById(id);
let cars = [], thumbs = {}, view = "eyes", carId = null, capTimer = 0;

function tiles() {
  $("tiles").innerHTML = cars.map(c => `<button class="mt" data-car="${c.id}">${thumbs[c.id] ? `<img src="${thumbs[c.id]}" alt="">` : ""}
    <b>${c.name}</b><small>${c.type} · ${c.seats} seats</small></button>`).join("");
}
function fillCar(c) {
  $("cName").textContent = c.name; $("cTag").textContent = c.tagline;
  $("cImg").src = thumbs[c.id] || ""; $("cImg").hidden = !thumbs[c.id];
  $("cSide").innerHTML = c.key.map(([v, u]) => `<div class="kpi"><b>${v}</b><span>${u}</span></div>`).join("") + `<div class="price">${c.price}</div>`;
  $("fName").textContent = c.name; $("fType").textContent = c.type;
  $("fRows").innerHTML = c.specs.map(([k, v]) => `<div class="r"><span>${k}</span><b>${v}</b></div>`).join("");
  $("wTo").textContent = c.name;
}
function show(v) {
  view = v;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === v));
  document.body.classList.toggle("up", v !== "eyes");
}

addEventListener("message", e => {
  const m = e.data || {};
  if (m.t === "init") { cars = m.cars; thumbs = m.thumbs || {}; tiles(); if (carId) fillCar(cars.find(c => c.id === carId)); }
  if (m.t === "view") {
    if (m.car) { carId = m.car; const c = cars.find(x => x.id === m.car); if (c) fillCar(c); }
    show(m.view);
  }
  if (m.t === "progress") $("wBar").style.width = Math.round(m.p * 100) + "%";
  if (m.t === "speaking") document.body.classList.toggle("speaking", !!m.on);
  if (m.t === "caption") {
    $("caption").textContent = m.text || ""; $("caption").classList.toggle("on", !!m.text);
    clearTimeout(capTimer); if (m.text) capTimer = setTimeout(() => $("caption").classList.remove("on"), 6000);
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-car]");
  if (b) parent.postMessage({ t: "tap", car: b.dataset.car }, "*");
});
(function blink() { document.body.classList.add("blink"); setTimeout(() => document.body.classList.remove("blink"), 130); setTimeout(blink, 2600 + Math.random() * 3400); })();
parent.postMessage({ t: "screen-ready" }, "*");
</script>
</body>
</html>
